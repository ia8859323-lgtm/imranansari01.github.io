<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay Pro - Secure Banking</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #2c3e50;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --google-blue: #1a73e8;
            --success-green: #27ae60;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }

        .container { 
            background: var(--bg-color); padding: 40px 25px; border-radius: 40px; 
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); 
            width: 100%; max-width: 420px; text-align: center; 
        }

        .header-profile {
            background: var(--bg-color); padding: 20px; border-radius: 25px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            margin-bottom: 25px; text-align: left; position: relative;
        }
        .header-info h4 { margin: 0; color: var(--google-blue); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .header-info p { margin: 4px 0 2px 0; font-size: 18px; font-weight: 700; color: var(--text-main); text-transform: capitalize; }
        
        .user-uid-box {
            font-size: 10px; color: #7f8c8d; background: rgba(0, 0, 0, 0.04);
            padding: 5px 8px; border-radius: 8px; display: inline-block;
            font-family: monospace; letter-spacing: 0.5px; margin-top: 5px;
            box-shadow: inset 1px 1px 3px var(--shadow-dark);
        }

        .balance-box { 
            background: var(--bg-color); padding: 30px 20px; border-radius: 25px; margin: 25px 0; 
            box-shadow: inset 10px 10px 20px var(--shadow-dark), inset -10px -10px 20px var(--shadow-light);
        }

        input { 
            width: 100%; padding: 16px; margin: 12px 0; border: none; border-radius: 15px; 
            background: var(--bg-color); box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            outline: none; font-weight: 500; color: var(--text-main);
        }

        .btn-send {
            width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 700;
            background: var(--bg-color); color: var(--success-green); cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-send:disabled { color: #bdc3c7; cursor: not-allowed; box-shadow: inset 2px 2px 5px var(--shadow-dark); }
        .btn-send:active:not(:disabled) { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.98); }

        .history-item { 
            background: var(--bg-color); padding: 15px; border-radius: 15px; margin-bottom: 15px;
            box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
            display: flex; justify-content: space-between; align-items: center;
        }

        #app-area, #auth-area { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-area" style="display: block;">
        <div style="margin-bottom: 40px;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="35">
            <h2 style="color: var(--google-blue); margin-top: 15px; font-weight: 800;">SafePay Pro</h2>
        </div>
        <button onclick="loginWithGoogle()" style="background:var(--bg-color); border:none; border-radius:50px; padding:15px 25px; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); cursor:pointer; width:100%; font-weight:600; color:#5f6368;">
            Sign in with Google
        </button>
    </div>

    <div id="app-area">
        <div class="header-profile">
            <div class="header-info">
                <h4>Verified Account</h4>
                <p id="user-name-display">User Name</p>
                <div class="user-uid-box" id="user-uid-display">UID: Loading...</div>
            </div>
            <button onclick="auth.signOut()" style="position:absolute; top:20px; right:20px; background:none; border:none; color:#e74c3c; font-size:10px; font-weight:800; cursor:pointer;">LOGOUT</button>
        </div>

        <div class="balance-box">
            <div style="font-size:12px; color:#7f8c8d; font-weight:700; letter-spacing:1px;">AVAILABLE BALANCE</div>
            <div style="font-size:40px; font-weight:800; color:var(--google-blue); margin-top:5px;">₹<span id="balance-display">0</span></div>
        </div>

        <div style="text-align: left;">
            <input type="text" id="target-uid" placeholder="Recipient UID" oninput="checkRecipientName()">
            <div id="receiver-name-display" style="font-size:12px; font-weight:bold; height:15px; margin-bottom:12px; padding-left:10px;"></div>
            
            <input type="number" id="pay-amount" placeholder="Amount (₹)">
            <button class="btn-send" id="pay-btn" onclick="sendMoney()">Send Securely</button>
        </div>

        <p id="msg" style="font-size:12px; margin-top:15px; font-weight:700;"></p>

        <div style="margin-top: 40px; text-align: left;">
            <h4 style="font-size:12px; color:#7f8c8d; letter-spacing:1px; border-bottom: 2px solid var(--shadow-dark); padding-bottom: 8px; margin-bottom: 15px;">RECENT TRANSACTIONS</h4>
            <div id="history-list" style="max-height: 250px; overflow-y: auto; padding: 5px;"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRxmhRbGjvdUY6pUe9L4bIrRwXL7230Hg",
      authDomain: "cardpay-50c00.firebaseapp.com",
      databaseURL: "https://cardpay-50c00-default-rtdb.firebaseio.com",
      projectId: "cardpay-50c00",
      storageBucket: "cardpay-50c00.firebasestorage.app",
      messagingSenderId: "923476412963",
      appId: "1:923476412963:web:19c6de7aa5666956227f96"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const rtdb = firebase.database();

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('auth-area').style.display = 'none';
            document.getElementById('app-area').style.display = 'block';
            document.getElementById('user-name-display').innerText = user.displayName;
            document.getElementById('user-uid-display').innerText = "UID: " + user.uid;
            setupAccount(user);
            fetchBalance(user.uid);
            loadHistory(user.uid);
        } else {
            document.getElementById('auth-area').style.display = 'block';
            document.getElementById('app-area').style.display = 'none';
        }
    });

    function setupAccount(user) {
        rtdb.ref('users/' + user.uid).once('value', snap => {
            if (!snap.exists()) {
                rtdb.ref('users/' + user.uid).set({ name: user.displayName, email: user.email, balance: 100 });
            }
        });
    }

    function fetchBalance(uid) {
        rtdb.ref('users/' + uid + '/balance').on('value', snap => {
            document.getElementById('balance-display').innerText = snap.val() || 0;
        });
    }

    function checkRecipientName() {
        const tid = document.getElementById('target-uid').value.trim();
        const disp = document.getElementById('receiver-name-display');
        if (tid.length > 15) {
            rtdb.ref('users/' + tid + '/name').once('value', snap => {
                disp.innerText = snap.exists() ? "✓ " + snap.val() : "✕ Account Not Found";
                disp.style.color = snap.exists() ? "#27ae60" : "#e74c3c";
            });
        } else { disp.innerText = ""; }
    }

    function sendMoney() {
        const target = document.getElementById('target-uid').value.trim();
        const amtInput = document.getElementById('pay-amount');
        const amt = parseInt(amtInput.value);
        const myUid = auth.currentUser.uid;
        const myName = auth.currentUser.displayName;
        const btn = document.getElementById('pay-btn');
        const msg = document.getElementById('msg');

        if (!target || isNaN(amt) || amt <= 0) {
            msg.innerText = "विवरण सही भरें।";
            msg.style.color = "#e74c3c";
            return;
        }

        if (target === myUid) {
            msg.innerText = "खुद को पैसे नहीं भेज सकते।";
            msg.style.color = "#e74c3c";
            return;
        }

        // सुरक्षा सुधार: बटन डिसेबल करें
        btn.disabled = true;
        btn.innerText = "Processing...";

        rtdb.ref('users/' + target + '/name').once('value', nSnap => {
            if (!nSnap.exists()) {
                msg.innerText = "UID गलत है।";
                msg.style.color = "#e74c3c";
                btn.disabled = false;
                btn.innerText = "Send Securely";
                return;
            }

            const targetName = nSnap.val();
            
            rtdb.ref('users/' + myUid + '/balance').transaction(curr => {
                if (curr !== null && curr >= amt) {
                    return curr - amt;
                }
                return; 
            }, (err, committed) => {
                if (committed) {
                    rtdb.ref('users/' + target + '/balance').transaction(c => (c || 0) + amt);
                    
                    rtdb.ref('transactions').push({
                        senderId: myUid, senderName: myName,
                        receiverId: target, receiverName: targetName,
                        amount: amt, 
                        timestamp: firebase.database.ServerValue.TIMESTAMP // सर्वर टाइम का उपयोग
                    });

                    msg.innerText = "₹" + amt + " सफलतापूर्व भेज दिए गए।";
                    msg.style.color = "#27ae60";
                    amtInput.value = "";
                    document.getElementById('target-uid').value = "";
                } else {
                    msg.innerText = "बैलेंस कम है या एरर हुआ।";
                    msg.style.color = "#e74c3c";
                }
                btn.disabled = false;
                btn.innerText = "Send Securely";
            });
        });
    }

    function loadHistory(uid) {
        const list = document.getElementById('history-list');
        rtdb.ref('transactions').on('value', snap => {
            list.innerHTML = "";
            snap.forEach(child => {
                const tx = child.val();
                if (tx.senderId === uid || tx.receiverId === uid) {
                    const isSent = tx.senderId === uid;
                    const person = isSent ? tx.receiverName : tx.senderName;
                    const div = document.createElement('div');
                    div.className = "history-item";
                    div.innerHTML = `
                        <div style="text-align:left;">
                            <div style="font-weight:700; color:var(--text-main); font-size:14px;">${person}</div>
                            <div style="font-size:10px; color:#95a5a6; font-weight:700;">${isSent ? 'MONEY SENT' : 'MONEY RECEIVED'}</div>
                        </div>
                        <b style="color:${isSent ? '#e74c3c' : '#27ae60'}; font-size:16px;">${isSent ? '-' : '+'} ₹${tx.amount}</b>
                    `;
                    list.prepend(div);
                }
            });
        });
    }
</script>
</body>
</html>
