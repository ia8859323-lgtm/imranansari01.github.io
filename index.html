<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay Pro - Secure Banking</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #2c3e50;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --google-blue: #1a73e8;
            --success-green: #27ae60;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 25px; }

        /* मुख्य 3D कंटेनर */
        .container { 
            background: var(--bg-color); padding: 45px 30px; border-radius: 50px; 
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); 
            width: 100%; max-width: 420px; text-align: center; 
        }

        /* प्रोफाइल कार्ड स्टाइल */
        .header-profile {
            background: var(--bg-color); padding: 22px; border-radius: 25px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            margin-bottom: 30px; text-align: left; position: relative;
        }
        .header-info h4 { margin: 0; color: var(--google-blue); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 800; }
        .header-info p { margin: 6px 0 2px 0; font-size: 18px; font-weight: 700; color: var(--text-main); text-transform: capitalize; }
        
        .user-uid-box {
            font-size: 10px; color: #7f8c8d; background: rgba(0, 0, 0, 0.04);
            padding: 6px 10px; border-radius: 10px; display: inline-block;
            font-family: monospace; letter-spacing: 0.5px; margin-top: 8px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark);
        }

        /* बैलेंस बॉक्स की गहराई */
        .balance-box { 
            background: var(--bg-color); padding: 35px 20px; border-radius: 30px; margin: 30px 0; 
            box-shadow: inset 10px 10px 20px var(--shadow-dark), inset -10px -10px 20px var(--shadow-light);
        }

        input { 
            width: 100%; padding: 18px; margin: 15px 0; border: none; border-radius: 18px; 
            background: var(--bg-color); box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            outline: none; font-weight: 600; color: var(--text-main); font-size: 15px;
        }

        /* बटन उभार */
        .btn-send {
            width: 100%; padding: 20px; border-radius: 20px; border: none; font-weight: 800;
            background: var(--bg-color); color: var(--success-green); cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            text-transform: uppercase; letter-spacing: 1.5px; margin-top: 10px;
        }
        .btn-send:active:not(:disabled) { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.97); }

        /* हिस्ट्री आइटम्स */
        .history-item { 
            background: var(--bg-color); padding: 18px; border-radius: 20px; margin-bottom: 18px;
            box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
            display: flex; justify-content: space-between; align-items: center;
        }

        #app-area, #auth-area { display: none; }

        .google-btn-3d {
            background: var(--bg-color); border: none; border-radius: 50px; padding: 18px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            cursor: pointer; width: 100%; font-weight: 700; color: #5f6368;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .google-btn-3d:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-area">
        <div style="margin-bottom: 45px;">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" width="45">
            <h2 style="color: var(--google-blue); margin-top: 20px; font-weight: 800; letter-spacing: -0.5px;">SafePay Pro</h2>
            <p style="font-size: 13px; color: #7f8c8d;">Secure Portal Access</p>
        </div>
        <button class="google-btn-3d" onclick="loginWithGoogle()">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" width="22">
            Sign in with Google
        </button>
    </div>

    <div id="app-area">
        <div class="header-profile">
            <div class="header-info">
                <h4>Verified Account</h4>
                <p id="user-name-display">User Name</p>
                <div class="user-uid-box" id="user-uid-display">UID: Loading...</div>
            </div>
            <button onclick="auth.signOut()" style="position:absolute; top:22px; right:22px; background:none; border:none; color:#e74c3c; font-size:11px; font-weight:800; cursor:pointer; opacity: 0.7;">LOGOUT</button>
        </div>

        <div class="balance-box">
            <div style="font-size:12px; color:#7f8c8d; font-weight:700; letter-spacing:1.5px;">AVAILABLE BALANCE</div>
            <div style="font-size:42px; font-weight:800; color: var(--google-blue); margin-top:8px;">₹<span id="balance-display">0</span></div>
        </div>

        <div style="text-align: left; padding: 0 5px;">
            <input type="text" id="target-uid" placeholder="Recipient UID" oninput="checkRecipientName()">
            <div id="receiver-name-display" style="font-size:12px; font-weight:bold; height:15px; margin-bottom:15px; padding-left:12px;"></div>
            
            <input type="number" id="pay-amount" placeholder="Amount (₹)">
            <button class="btn-send" id="pay-btn" onclick="sendMoney()">Send Securely</button>
        </div>

        <p id="msg" style="font-size:12px; margin-top:18px; font-weight:700;"></p>

        <div style="margin-top: 45px; text-align: left;">
            <h4 style="font-size:12px; color:#7f8c8d; letter-spacing:1.5px; border-bottom: 2px solid var(--shadow-dark); padding-bottom: 10px; margin-bottom: 20px;">RECENT ACTIVITY</h4>
            <div id="history-list" style="max-height: 280px; overflow-y: auto; padding: 5px;"></div>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyBRxmhRbGjvdUY6pUe9L4bIrRwXL7230Hg",
      authDomain: "cardpay-50c00.firebaseapp.com",
      databaseURL: "https://cardpay-50c00-default-rtdb.firebaseio.com",
      projectId: "cardpay-50c00",
      storageBucket: "cardpay-50c00.firebasestorage.app",
      messagingSenderId: "923476412963",
      appId: "1:923476412963:web:19c6de7aa5666956227f96"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const rtdb = firebase.database();

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('auth-area').style.display = 'none';
            document.getElementById('app-area').style.display = 'block';
            document.getElementById('user-name-display').innerText = user.displayName;
            document.getElementById('user-uid-display').innerText = "UID: " + user.uid;
            setupAccount(user);
            fetchBalance(user.uid);
            loadHistory(user.uid);
        } else {
            document.getElementById('auth-area').style.display = 'block';
            document.getElementById('app-area').style.display = 'none';
        }
    });

    function setupAccount(user) {
        rtdb.ref('users/' + user.uid).once('value', snap => {
            if (!snap.exists()) {
                rtdb.ref('users/' + user.uid).set({ name: user.displayName, email: user.email, balance: 100 });
            }
        });
    }

    function fetchBalance(uid) {
        rtdb.ref('users/' + uid + '/balance').on('value', snap => {
            document.getElementById('balance-display').innerText = snap.val() || 0;
        });
    }

    function checkRecipientName() {
        const tid = document.getElementById('target-uid').value.trim();
        const disp = document.getElementById('receiver-name-display');
        if (tid.length > 15) {
            rtdb.ref('users/' + tid + '/name').once('value', snap => {
                disp.innerText = snap.exists() ? "✓ Account: " + snap.val() : "✕ Invalid UID";
                disp.style.color = snap.exists() ? "#27ae60" : "#e74c3c";
            });
        } else { disp.innerText = ""; }
    }

    function sendMoney() {
        const target = document.getElementById('target-uid').value.trim();
        const amtInput = document.getElementById('pay-amount');
        const amt = parseInt(amtInput.value);
        const myUid = auth.currentUser.uid;
        const btn = document.getElementById('pay-btn');
        const msg = document.getElementById('msg');

        if (!target || isNaN(amt) || amt <= 0 || target === myUid) return;

        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        rtdb.ref('users/' + target + '/name').once('value', nSnap => {
            if (!nSnap.exists()) {
                msg.innerText = "UID Error";
                btn.disabled = false;
                btn.innerText = "SEND SECURELY";
                return;
            }

            const tName = nSnap.val();
            rtdb.ref('users/' + myUid + '/balance').transaction(curr => {
                if (curr >= amt) return curr - amt;
            }, (err, committed) => {
                if (committed) {
                    rtdb.ref('users/' + target + '/balance').transaction(c => (c || 0) + amt);
                    rtdb.ref('transactions').push({
                        senderId: myUid, senderName: auth.currentUser.displayName,
                        receiverId: target, receiverName: tName,
                        amount: amt, timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    msg.innerText = "SUCCESS! ₹" + amt + " Sent.";
                    msg.style.color = "#27ae60";
                    amtInput.value = "";
                } else {
                    msg.innerText = "Insufficient Balance";
                    msg.style.color = "#e74c3c";
                }
                btn.disabled = false;
                btn.innerText = "SEND SECURELY";
            });
        });
    }

    function loadHistory(uid) {
        const list = document.getElementById('history-list');
        rtdb.ref('transactions').on('value', snap => {
            list.innerHTML = "";
            snap.forEach(child => {
                const tx = child.val();
                if (tx.senderId === uid || tx.receiverId === uid) {
                    const isSent = tx.senderId === uid;
                    const person = isSent ? tx.receiverName : tx.senderName;
                    const div = document.createElement('div');
                    div.className = "history-item";
                    div.innerHTML = `
                        <div style="text-align:left;">
                            <div style="font-weight:700; color:var(--text-main); font-size:15px;">${person}</div>
                            <div style="font-size:10px; color:#95a5a6; font-weight:800; letter-spacing:0.5px;">${isSent ? 'DEBIT' : 'CREDIT'}</div>
                        </div>
                        <b style="color:${isSent ? '#e74c3c' : '#27ae60'}; font-size:18px;">${isSent ? '-' : '+'} ₹${tx.amount}</b>
                    `;
                    list.prepend(div);
                }
            });
        });
    }
</script>
</body>
</html>
