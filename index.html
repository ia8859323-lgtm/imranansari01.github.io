<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay Pro - Secure Banking</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        /* 3D Neumorphic Theme Implementation */
        :root {
            --bg-color: #e6e9ef;
            --text-color: #34495e;
            --shadow-dark: #bec3c9;
            --shadow-light: #ffffff;
            --google-blue: #1a73e8;
            --success-green: #27ae60;
            --danger-red: #e74c3c;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            color: var(--text-color);
        }

        /* मुख्य कार्ड - 3D उठा हुआ */
        .container { 
            background: var(--bg-color); 
            padding: 35px 25px; 
            border-radius: 40px; 
            box-shadow: 20px 20px 60px var(--shadow-dark), 
                        -20px -20px 60px var(--shadow-light); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }

        h2 { color: var(--google-blue); margin-bottom: 5px; font-weight: 800; }

        /* गूगल लॉगिन बटन - उठा हुआ और रिलायबल */
        .btn-google { 
            background: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            border: none;
            border-radius: 20px;
            font-weight: 600;
            padding: 18px;
            box-shadow: 8px 8px 16px var(--shadow-dark), 
                        -8px -8px 16px var(--shadow-light);
            transition: 0.2s ease;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
        }

        .btn-google:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                        inset -6px -6px 12px var(--shadow-light);
            transform: scale(0.98);
        }

        /* बैलेंस बॉक्स - जेनुइन "वॉल्ट" लुक */
        .balance-box { 
            background: var(--bg-color); 
            padding: 30px 20px; 
            border-radius: 25px; 
            margin: 25px 0; 
            box-shadow: inset 10px 10px 20px var(--shadow-dark), 
                        inset -10px -10px 20px var(--shadow-light);
        }

        .balance-amount { 
            font-size: 38px; 
            font-weight: 800; 
            color: var(--google-blue); 
            margin-top: 8px;
        }

        /* इनपुट फील्ड्स - दबे हुए (Inset) */
        input { 
            width: 100%; 
            padding: 16px; 
            margin: 12px 0; 
            border: none; 
            border-radius: 15px; 
            background: var(--bg-color);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                        inset -6px -6px 12px var(--shadow-light);
            outline: none; 
            color: var(--text-color);
            font-weight: 500;
        }

        /* ट्रांजेक्शन बटन */
        .btn-send { 
            background: var(--bg-color); 
            color: var(--success-green); 
            margin-top: 20px; 
            font-size: 18px; 
            font-weight: 700;
            border-radius: 15px;
            box-shadow: 8px 8px 16px var(--shadow-dark), 
                        -8px -8px 16px var(--shadow-light);
            border: none;
            cursor: pointer;
            padding: 16px;
            width: 100%;
        }

        .btn-send:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                        inset -6px -6px 12px var(--shadow-light);
        }

        /* यूज़र इंफो बॉक्स */
        .infoText { 
            font-size: 13px; 
            text-align: left; 
            margin-bottom: 20px; 
            background: var(--bg-color); 
            padding: 15px; 
            border-radius: 18px; 
            box-shadow: 4px 4px 10px var(--shadow-dark), 
                        -4px -4px 10px var(--shadow-light);
            border-left: 5px solid var(--google-blue);
        }

        /* हिस्ट्री आइटम कार्ड्स */
        .history-item { 
            padding: 16px; 
            margin-bottom: 15px;
            border-radius: 15px;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), 
                        -5px -5px 10px var(--shadow-light);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .trust-badge {
            font-size: 10px;
            color: #95a5a6;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .sent-amt { color: var(--danger-red); font-weight: bold; }
        .recv-amt { color: var(--success-green); font-weight: bold; }
        #app-area { display: none; }
        .history-list { max-height: 280px; overflow-y: auto; margin-top: 15px; padding: 5px; scrollbar-width: none; }
        #receiver-name-display { font-size: 12px; font-weight: 700; min-height: 18px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>SafePay Pro</h2>
    <p style="font-size: 12px; color: #7f8c8d; margin-bottom: 10px;">सुरक्षित एवं विश्वसनीय बैंकिंग</p>
    <div class="trust-badge">🛡️ Google Verified Security • 256-bit Encryption</div>

    <div id="auth-area">
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20" alt="">
            Google के साथ सुरक्षित लॉगिन
        </button>
    </div>

    <div id="app-area">
        <div class="infoText">
            नमस्ते, <strong id="user-name"></strong><br>
            <small>ID: <span id="user-uid" style="font-family: monospace; color: #7f8c8d;"></span></small>
        </div>

        <div class="balance-box">
            <div style="font-size: 14px; color: #7f8c8d; font-weight: 600;">उपलब्ध बैलेंस</div>
            <div class="balance-amount">₹<span id="balance-display">0</span></div>
        </div>

        <div style="text-align: left;">
            <label style="font-size: 13px; font-weight: 700; margin-left: 5px;">प्राप्तकर्ता की UID:</label>
            <input type="text" id="target-uid" placeholder="UID यहाँ पेस्ट करें" oninput="checkRecipientName()">
            <div id="receiver-name-display"></div> 
            
            <label style="font-size: 13px; font-weight: 700; margin-left: 5px;">राशि (₹):</label>
            <input type="number" id="pay-amount" placeholder="0.00" min="1">
            
            <button class="btn-send" id="pay-btn" onclick="sendMoney()">सुरक्षित भुगतान करें</button>
        </div>
        
        <p id="msg" style="font-size: 13px; margin-top: 15px; font-weight: 600;"></p>

        <div class="history-section" style="margin-top: 30px;">
            <h4 style="margin: 0 0 15px 0; color: var(--text-color); display: flex; justify-content: space-between;">
                <span>लेन-देन इतिहास</span>
                <span onclick="loadTransactionHistory()" style="cursor:pointer; font-size:10px; color:var(--google-blue);">रिफ्रेश ↻</span>
            </h4>
            <div id="history-list" class="history-list"></div>
        </div>

        <button onclick="auth.signOut()" style="background:none; color:var(--danger-red); text-decoration:none; font-size:12px; font-weight:700; margin-top:25px; border:none; cursor:pointer; opacity: 0.8;">सेफ लॉग आउट करें</button>
    </div>
</div>

<script>
    // आपका Firebase कॉन्फ़िगरेशन और सारा लॉजिक यहाँ रहेगा (वही जो आपने दिया था)
    // मैंने इसे छोटा रखने के लिए यहाँ दोबारा नहीं लिखा है, आप अपना पिछला <script> इस्तेमाल करें।
</script>
</body>
</html>
