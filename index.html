<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay Pro - Secure Banking</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #2c3e50;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --google-blue: #1a73e8;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: all 0.2s ease; }
        
        body { 
            background-color: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px;
        }

        /* 3D मुख्य कंटेनर */
        .container { 
            background: var(--bg-color); 
            padding: 50px 30px; 
            border-radius: 50px; 
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); 
            width: 100%; max-width: 420px; text-align: center; 
        }

        .google-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .google-header span { font-size: 24px; font-weight: 600; color: #5f6368; }

        .main-title { font-size: 19px; color: var(--text-main); margin-bottom: 30px; font-weight: 500; line-height: 1.4; }

        /* 3D गूगल बटन - क्लिक इशू फिक्स किया गया */
        .btn-google { 
            background: var(--bg-color); border: none; border-radius: 50px; 
            padding: 15px 25px; display: flex; align-items: center; 
            justify-content: space-between; width: 100%; cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            outline: none;
        }

        .btn-google:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            transform: scale(0.97);
        }

        .lock-icon-circle {
            background: var(--bg-color); width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            color: #95a5a6; pointer-events: none; /* क्लिक को बटन तक जाने देता है */
        }

        /* ऐप एरिया (लॉगिन के बाद) */
        #app-area { display: none; text-align: left; }
        
        .balance-box { 
            background: var(--bg-color); padding: 25px; border-radius: 25px; margin: 20px 0; 
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
            text-align: center;
        }
        
        input { 
            width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; 
            background: var(--bg-color); box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            outline: none;
        }

        .btn-send {
            width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 700;
            background: var(--bg-color); color: #27ae60; cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            margin-top: 10px;
        }

        .history-item { 
            background: var(--bg-color); padding: 12px; border-radius: 12px; margin-bottom: 10px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex; justify-content: space-between; font-size: 13px;
        }

        .trust-footer { margin-top: 35px; font-size: 11px; color: #7f8c8d; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-area">
        <div class="google-header">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="25">
            <span>Google</span>
        </div>
        <div class="main-title">Secure Access to<br>SafePay Investment Portal</div>
        
        <button class="btn-google" onclick="loginWithGoogle()">
            <div style="width:20px"></div>
            <span style="font-weight:600; color:#5f6368;">Sign in with Google</span>
            <div class="lock-icon-circle">
                <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>
            </div>
        </button>

        <div class="trust-footer">
            A certified secure connection. Verified by Google Identity Services.<br>
            <strong>Your investment data is protected.</strong>
        </div>
    </div>

    <div id="app-area">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="color:var(--google-blue); margin:0;">Dashboard</h3>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size:11px;">लॉग आउट</button>
        </div>
        <p style="font-size:12px; margin:10px 0;">नमस्ते, <b id="user-name"></b></p>

        <div class="balance-box">
            <div style="font-size:13px; color:#7f8c8d;">कुल बैलेंस</div>
            <div style="font-size:32px; font-weight:800; color:var(--google-blue);">₹<span id="balance-display">0</span></div>
        </div>

        <input type="text" id="target-uid" placeholder="प्राप्तकर्ता की UID" oninput="checkRecipientName()">
        <div id="receiver-name-display" style="font-size:11px; margin-left:5px; height:12px;"></div>
        
        <input type="number" id="pay-amount" placeholder="राशि (₹)">
        <button class="btn-send" id="pay-btn" onclick="sendMoney()">सुरक्षित ट्रांसफर</button>
        
        <p id="msg" style="font-size:12px; text-align:center; margin-top:10px;"></p>

        <h5 style="margin:20px 0 10px 0;">हालिया लेनदेन</h5>
        <div id="history-list" style="max-height:150px; overflow-y:auto;"></div>
    </div>
</div>

<script>
    // Firebase Config (Your Original Keys)
    const firebaseConfig = {
      apiKey: "AIzaSyBRxmhRbGjvdUY6pUe9L4bIrRwXL7230Hg",
      authDomain: "cardpay-50c00.firebaseapp.com",
      databaseURL: "https://cardpay-50c00-default-rtdb.firebaseio.com",
      projectId: "cardpay-50c00",
      storageBucket: "cardpay-50c00.firebasestorage.app",
      messagingSenderId: "923476412963",
      appId: "1:923476412963:web:19c6de7aa5666956227f96"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const rtdb = firebase.database();

    // लॉगिन फंक्शन
    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
            .then((result) => console.log("Login Success"))
            .catch(e => alert("Error: " + e.message));
    }

    // स्टेट चेंज ऑब्जर्वर
    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('auth-area').style.display = 'none';
            document.getElementById('app-area').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName;
            setupAccount(user);
            fetchBalance(user.uid);
            loadHistory(user.uid);
        } else {
            document.getElementById('auth-area').style.display = 'block';
            document.getElementById('app-area').style.display = 'none';
        }
    });

    function setupAccount(user) {
        rtdb.ref('users/' + user.uid).once('value', snap => {
            if (!snap.exists()) {
                rtdb.ref('users/' + user.uid).set({ name: user.displayName, email: user.email, balance: 100 });
            }
        });
    }

    function fetchBalance(uid) {
        rtdb.ref('users/' + uid + '/balance').on('value', snap => {
            document.getElementById('balance-display').innerText = snap.val() || 0;
        });
    }

    function checkRecipientName() {
        const tid = document.getElementById('target-uid').value.trim();
        const disp = document.getElementById('receiver-name-display');
        if (tid.length > 15) {
            rtdb.ref('users/' + tid + '/name').once('value', snap => {
                disp.innerText = snap.exists() ? "✓ " + snap.val() : "✕ यूज़र नहीं मिला";
                disp.style.color = snap.exists() ? "#27ae60" : "#e74c3c";
            });
        } else { disp.innerText = ""; }
    }

    function sendMoney() {
        const target = document.getElementById('target-uid').value.trim();
        const amt = parseInt(document.getElementById('pay-amount').value);
        const myUid = auth.currentUser.uid;
        const msg = document.getElementById('msg');

        if (!target || isNaN(amt) || amt <= 0 || target === myUid) {
            msg.innerText = "विवरण सही भरें।"; return;
        }

        rtdb.ref('users/' + myUid + '/balance').transaction(curr => {
            if (curr >= amt) return curr - amt;
        }, (err, committed) => {
            if (committed) {
                rtdb.ref('users/' + target + '/balance').transaction(c => (c || 0) + amt);
                rtdb.ref('transactions').push({
                    senderId: myUid, senderName: auth.currentUser.displayName,
                    receiverId: target, amount: amt, timestamp: Date.now()
                });
                msg.innerText = "ट्रांसफर सफल!"; msg.style.color = "#27ae60";
            } else {
                msg.innerText = "बैलेंस कम है।"; msg.style.color = "#e74c3c";
            }
        });
    }

    function loadHistory(uid) {
        const list = document.getElementById('history-list');
        rtdb.ref('transactions').on('value', snap => {
            list.innerHTML = "";
            snap.forEach(child => {
                const tx = child.val();
                if (tx.senderId === uid || tx.receiverId === uid) {
                    const isSent = tx.senderId === uid;
                    const div = document.createElement('div');
                    div.className = "history-item";
                    div.innerHTML = `<span>${isSent ? 'To: UID...' : 'Received'}</span>
                                     <b style="color:${isSent ? '#e74c3c':'#27ae60'}">${isSent ? '-':'+'} ₹${tx.amount}</b>`;
                    list.prepend(div);
                }
            });
        });
    }
</script>
</body>
</html>
