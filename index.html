<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay Pro - Secure Banking</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5; /* इमेज के अनुसार सॉफ्ट बैकग्राउंड */
            --text-main: #2c3e50;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --google-blue: #4285f4;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: all 0.3s ease; }
        
        body { 
            background-color: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        /* मुख्य सफेद 3D कार्ड (बिल्कुल फोटो जैसा) */
        .container { 
            background: var(--bg-color); 
            padding: 50px 30px; 
            border-radius: 50px; 
            box-shadow: 20px 20px 60px var(--shadow-dark), 
                        -20px -20px 60px var(--shadow-light); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            position: relative;
        }

        /* गूगल ब्रांडिंग एरिया */
        .google-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .google-header span {
            font-size: 24px;
            font-weight: 600;
            color: #5f6368;
            letter-spacing: -0.5px;
        }

        .main-title {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.4;
        }

        /* 3D गूगल बटन - फोटो जैसा उभार */
        .btn-google { 
            background: var(--bg-color); 
            border: none;
            border-radius: 50px; /* गोल बटन */
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            margin: 0 auto;
            cursor: pointer;
            box-shadow: 8px 8px 15px var(--shadow-dark), 
                        -8px -8px 15px var(--shadow-light);
            position: relative;
        }

        .btn-google span {
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            flex-grow: 1;
        }

        /* लॉक आइकन वाला हिस्सा जो बटन के अंदर है */
        .lock-icon-circle {
            background: var(--bg-color);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light);
            color: #95a5a6;
        }

        .btn-google:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                        inset -6px -6px 12px var(--shadow-light);
            transform: scale(0.98);
        }

        /* ट्रस्ट टेक्स्ट - इमेज के नीचे वाला भाग */
        .trust-footer {
            margin-top: 40px;
            font-size: 11px;
            color: #7f8c8d;
            line-height: 1.8;
        }

        /* ऐप एरिया स्टाइलिंग (लॉगिन के बाद) */
        #app-area { display: none; }
        .balance-box { 
            background: var(--bg-color); 
            padding: 30px; 
            border-radius: 30px; 
            margin: 25px 0; 
            box-shadow: inset 8px 8px 16px var(--shadow-dark), 
                        inset -8px -8px 16px var(--shadow-light);
        }
        .balance-amount { font-size: 36px; font-weight: 800; color: var(--google-blue); }

        input { 
            width: 100%; padding: 16px; margin: 15px 0; border: none; border-radius: 15px; 
            background: var(--bg-color);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            outline: none;
        }

        .btn-send {
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 700;
            background: var(--bg-color); color: #27ae60; cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }
        .btn-send:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
        
        .history-item { 
            background: var(--bg-color); padding: 15px; border-radius: 15px; margin-bottom: 12px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }
        .sent-amt { color: #e74c3c; font-weight: bold; }
        .recv-amt { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="auth-area">
        <div class="google-header">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="28" alt="Google">
            <span>Google</span>
        </div>
        
        <div class="main-title">
            Secure Access to<br>SafePay Investment Portal
        </div>

        <button class="btn-google" onclick="loginWithGoogle()">
            <div style="width: 20px;"></div> <span>Sign in with Google</span>
            <div class="lock-icon-circle">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                </svg>
            </div>
        </button>

        <div class="trust-footer">
            A certified secure connection. Verified by Google Identity Services.<br>
            <strong>Your investment data is protected.</strong>
        </div>
    </div>

    <div id="app-area">
        <h3 style="color: var(--google-blue); margin-bottom: 5px;">Dashboard</h3>
        <p style="font-size: 12px; margin-bottom: 20px;">स्वागत है, <span id="user-name"></span></p>

        <div class="balance-box">
            <div style="font-size: 14px; opacity: 0.7;">कुल बैलेंस</div>
            <div class="balance-amount">₹<span id="balance-display">0</span></div>
        </div>

        <div style="text-align: left;">
            <input type="text" id="target-uid" placeholder="प्राप्तकर्ता की UID डालें" oninput="checkRecipientName()">
            <div id="receiver-name-display" style="font-size: 11px; margin: -10px 0 10px 5px; height: 15px;"></div>
            
            <input type="number" id="pay-amount" placeholder="राशि (₹)">
            <button class="btn-send" id="pay-btn" onclick="sendMoney()">सुरक्षित ट्रांसफर</button>
        </div>

        <div id="msg" style="font-size: 12px; margin-top: 15px;"></div>

        <div style="margin-top: 30px; text-align: left;">
            <h5 style="margin-bottom: 15px;">हालिया लेनदेन</h5>
            <div id="history-list" style="max-height: 200px; overflow-y: auto;"></div>
        </div>

        <button onclick="auth.signOut()" style="background:none; border:none; color:#e74c3c; cursor:pointer; margin-top:20px; font-size:12px; font-weight:bold;">सुरक्षित लॉग आउट</button>
    </div>
</div>

<script>
    // आपका Firebase कॉन्फ़िगरेशन
    const firebaseConfig = {
      apiKey: "AIzaSyBRxmhRbGjvdUY6pUe9L4bIrRwXL7230Hg",
      authDomain: "cardpay-50c00.firebaseapp.com",
      databaseURL: "https://cardpay-50c00-default-rtdb.firebaseio.com",
      projectId: "cardpay-50c00",
      storageBucket: "cardpay-50c00.firebasestorage.app",
      messagingSenderId: "923476412963",
      appId: "1:923476412963:web:19c6de7aa5666956227f96"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const rtdb = firebase.database();

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => alert("लॉगिन एरर: " + e.message));
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('auth-area').style.display = 'none';
            document.getElementById('app-area').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName;
            setupNewAccount(user);
            fetchLiveBalance(user.uid);
            loadTransactionHistory();
        } else {
            document.getElementById('auth-area').style.display = 'block';
            document.getElementById('app-area').style.display = 'none';
        }
    });

    // बाकी सारे लॉजिक फंक्शन्स (setupNewAccount, fetchLiveBalance, sendMoney, checkRecipientName, loadTransactionHistory)
    // आपके पुराने कोड वाले यहाँ काम करेंगे।

    function setupNewAccount(user) {
        rtdb.ref('users/' + user.uid).once('value', snapshot => {
            if (!snapshot.exists()) {
                rtdb.ref('users/' + user.uid).set({ name: user.displayName, email: user.email, balance: 100 });
            }
        });
    }

    function fetchLiveBalance(uid) {
        rtdb.ref('users/' + uid + '/balance').on('value', snap => {
            document.getElementById('balance-display').innerText = snap.val() || 0;
        });
    }

    function checkRecipientName() {
        const tid = document.getElementById('target-uid').value.trim();
        const display = document.getElementById('receiver-name-display');
        if (tid.length > 15) {
            rtdb.ref('users/' + tid + '/name').once('value', snap => {
                display.innerText = snap.exists() ? "✓ " + snap.val() : "✕ यूज़र नहीं मिला";
                display.style.color = snap.exists() ? "#27ae60" : "#e74c3c";
            });
        } else { display.innerText = ""; }
    }

    function sendMoney() {
        const targetUid = document.getElementById('target-uid').value.trim();
        const amount = parseInt(document.getElementById('pay-amount').value);
        const myUid = auth.currentUser.uid;
        const msg = document.getElementById('msg');

        if (!targetUid || isNaN(amount) || amount <= 0 || targetUid === myUid) {
            msg.innerText = "विवरण सही भरें।"; return;
        }

        rtdb.ref('users/' + myUid + '/balance').transaction(curr => {
            if (curr >= amount) return curr - amount;
        }, (err, committed) => {
            if (committed) {
                rtdb.ref('users/' + targetUid + '/balance').transaction(curr => (curr || 0) + amount);
                const txKey = rtdb.ref('transactions').push().key;
                rtdb.ref('transactions/' + txKey).set({
                    senderId: myUid, senderName: auth.currentUser.displayName,
                    receiverId: targetUid, amount: amount, timestamp: Date.now()
                });
                msg.innerText = "सफलतापूर्वक ट्रांसफर!";
                msg.style.color = "#27ae60";
            } else {
                msg.innerText = "बैलेंस कम है।";
                msg.style.color = "#e74c3c";
            }
        });
    }

    function loadTransactionHistory() {
        const uid = auth.currentUser.uid;
        const list = document.getElementById('history-list');
        rtdb.ref('transactions').on('value', snap => {
            list.innerHTML = "";
            snap.forEach(child => {
                const tx = child.val();
                if (tx.senderId === uid || tx.receiverId === uid) {
                    const isSent = tx.senderId === uid;
                    const item = document.createElement('div');
                    item.className = "history-item";
                    item.innerHTML = `<span>${isSent ? 'To: UID...' : 'Received'}</span>
                                      <span class="${isSent ? 'sent-amt' : 'recv-amt'}">${isSent ? '-' : '+'} ₹${tx.amount}</span>`;
                    list.prepend(item);
                }
            });
        });
    }
</script>
</body>
</html>
